name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # e2e's go.mod replaces the root module with a local path. A dependabot PR that
  # only bumps the root module's go.mod/go.sum (its own separate "/" gomod target)
  # can leave e2e/go.sum stale relative to what that bumped root module now needs
  # — e2e's own "/e2e" gomod target never touches it. Self-heal: tidy both modules
  # and push a fix commit before test/lint run, so a Dependabot PR goes green
  # without a manual `go mod tidy` + push. Runs only for Dependabot PRs — the
  # actor this repo already trusts with write access (see dependabot-auto-merge.yml).
  tidy:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push a fix commit to the PR branch
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go mod tidy (root)
        run: go mod tidy

      - name: go mod tidy (e2e)
        working-directory: e2e
        run: go mod tidy

      - name: Commit and push if go.mod/go.sum changed
        run: |
          if git diff --quiet -- go.mod go.sum e2e/go.mod e2e/go.sum; then
            echo "go.mod/go.sum already tidy; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum e2e/go.mod e2e/go.sum
          git commit -m "chore: go mod tidy"
          git push origin HEAD:"${{ github.head_ref }}"

  test:
    # Runs after tidy so a fix it pushed is picked up below (via the ref: on
    # Check out). A skipped tidy (the common, non-Dependabot case) is not a
    # failure — only a failed tidy should block the matrix.
    needs: [tidy]
    if: always() && needs.tidy.result != 'failure'
    # Cross-OS + Go-version matrix. The module floor is Go 1.26 (the code uses the
    # 1.26 new(expr) form), so the version axis is "go.mod floor" + "stable" rather
    # than older releases that wouldn't compile. Windows/macOS catch path- and
    # file-watcher (internal/dirmonitor) differences a Linux-only run would miss —
    # the maintainer develops on Windows, but base CI ran only on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # '1.26' = the go.mod language floor (setup-go resolves the latest 1.26.x);
        # 'stable' = the current release. Bump '1.26' when go.mod's floor moves.
        go: ['1.26', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      # submodules: recursive pulls the MaxMind-DB fixtures (test-data) used by
      # internal/ops tests. MaxMind-DB has its own go.mod, so it is excluded
      # from this module's ./... and never built or vetted here.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # Pick up tidy's fix commit on a Dependabot PR (its result is only
          # "success" when it actually ran, i.e. actor == dependabot[bot]);
          # every other run keeps the default ref (PR merge commit / branch).
          ref: ${{ needs.tidy.result == 'success' && github.head_ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          # Use the newest patch for each version axis (e.g. 1.26.5, not a cached
          # 1.26.4) so builds and tests run on the latest stdlib security fixes.
          check-latest: true
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      # Formatting (gofumpt) and vetting (govet, enable-all) are owned by the
      # lint job — a hard gate over both modules — so they are not repeated here.
      - name: Build
        run: go build ./...

      # Coverage is produced here (cheap -coverprofile overhead) rather than in a
      # separate job that would re-run the suite. It's platform-independent, so only
      # one cell uploads it — see the Codecov step below.
      - name: Test (race + coverage)
        # Quote -coverprofile: on the Windows runner (pwsh) an unquoted
        # `-coverprofile=coverage.out` is split, leaving Go a stray `.out` package
        # pattern ("FAIL .out [setup failed]"). Quoting is a no-op under bash.
        run: go test -race -covermode=atomic "-coverprofile=coverage.out" ./...

      # The e2e module is separate (own go.mod); it boots a real Caddy via
      # caddytest and uses its own e2e/testdata fixtures. -race instruments the
      # in-process server + watcher goroutines (the only place they run together).
      - name: E2E tests
        working-directory: e2e
        run: go test -race ./...

      # Upload from the single canonical cell only — coverage doesn't vary by OS or
      # Go version, so the other matrix cells would just produce duplicate reports.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          # Public repos upload tokenless; for a private repo set the CODECOV_TOKEN
          # secret. Until then, don't fail CI on a missing token.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    # See test's needs/if above: wait for tidy so a Dependabot fix commit lands
    # before lint runs against e2e's go.sum; a skipped tidy does not block lint.
    needs: [tidy]
    if: always() && needs.tidy.result != 'failure'
    runs-on: ubuntu-latest
    # Hard gate: lint failures fail CI. The tree is clean under .golangci.yml's
    # `default: all`; keep it that way (run `golangci-lint run` locally before
    # pushing — and `cd e2e && golangci-lint run` for the e2e module).
    strategy:
      fail-fast: false
      # Each Go module needs its own run: golangci-lint's ./... respects module
      # boundaries, so the root invocation does not descend into e2e/. Both
      # modules share the root .golangci.yml (golangci-lint walks up to find it).
      matrix:
        module: [".", "e2e"]
    steps:
      # No submodule needed: golangci-lint only lints the target module, and the
      # MaxMind-DB submodule is a separate module it does not descend into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tidy.result == 'success' && github.head_ref || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Newest patch of the go.mod minor, matching the other jobs.
          check-latest: true

      - name: golangci-lint (${{ matrix.module }})
        # Action major must match golangci-lint major: v7 ↔ golangci-lint v2.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          working-directory: ${{ matrix.module }}

  # Stable aggregate checks for branch protection. Each passes only if every cell of
  # its matrix job did, so required-status-checks can reference one fixed context
  # ("test-gate" / "lint-gate") instead of the brittle per-cell names like
  # "test (ubuntu-latest, 1.26)" that change whenever the matrix changes.
  # `if: always()` makes the gate run (and report) even when a needed job failed.
  test-gate:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require the test matrix to have passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test.result }}"
            exit 1
          fi

  lint-gate:
    if: always()
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Require the lint matrix to have passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "lint matrix result: ${{ needs.lint.result }}"
            exit 1
          fi
